<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Flask Admin Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='admin/css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 48px;
            width: 100%;
            max-width: 480px;
            animation: fadeInUp 0.8s ease-out;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #303133;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #409EFF 0%, #667eea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .login-header p {
            color: #909399;
            font-size: 16px;
            font-weight: 400;
        }
        
        .login-form {
            margin-top: 24px;
        }
        
        .login-form .el-form-item {
            margin-bottom: 24px;
        }
        
        .login-btn {
            width: 100%;
            height: 52px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #409EFF 0%, #667eea 100%);
            border: none;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(64, 158, 255, 0.4);
        }
        
        .login-footer {
            text-align: center;
            margin-top: 32px;
            color: #909399;
            font-size: 14px;
        }
        
        .login-footer p {
            margin: 4px 0;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 576px) {
            .login-card {
                padding: 32px 24px;
                margin: 0 16px;
            }
            
            .login-header h1 {
                font-size: 28px;
            }
            
            .login-header p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h1>🤖 Flask Admin Pro</h1>
                    <p>现代化管理后台系统</p>
                </div>
                <el-form :model="form" :rules="rules" ref="loginFormRef" class="login-form">
                    <el-form-item prop="username">
                        <el-input 
                            v-model="form.username" 
                            placeholder="请输入用户名"
                            size="large"
                            prefix-icon="User"
                        ></el-input>
                    </el-form-item>
                    <el-form-item prop="password">
                        <el-input 
                            v-model="form.password" 
                            type="password" 
                            placeholder="请输入密码"
                            size="large"
                            prefix-icon="Lock"
                            @keyup.enter="handleLogin"
                        ></el-input>
                    </el-form-item>
                    <el-form-item>
                        <el-button 
                            type="primary" 
                            class="login-btn" 
                            :loading="loading" 
                            @click="handleLogin"
                        >
                            {% raw %}{{ loading ? '登录中...' : '立即登录' }}{% endraw %}
                        </el-button>
                    </el-form-item>
                </el-form>
                <div class="login-footer">
                    <p>💡 默认账号：admin / admin123</p>
                    <p>🚀 零构建成本 · 开箱即用 · 现代化 UI</p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script>
        const { createApp, ref, reactive } = Vue;
        createApp({
            setup() {
                const loginFormRef = ref(null);
                const loading = ref(false);
                const form = reactive({ username: '', password: '' });
                const rules = { 
                    username: [{ required: true, message: '请输入用户名', trigger: 'blur' }], 
                    password: [{ required: true, message: '请输入密码', trigger: 'blur' }] 
                };
                
                const handleLogin = async () => {
                    if (!loginFormRef.value) return;
                    await loginFormRef.value.validate(async (valid) => {
                        if ( valid ) {
                            loading.value = true;
                            try {
                                const res = await fetch('/__admin__/api/login', { 
                                    method: 'POST', 
                                    headers: { 'Content-Type': 'application/json' }, 
                                    body: JSON.stringify(form) 
                                });
                                const data = await res.json();
                                if (data.success) { 
                                    ElementPlus.ElMessage.success('登录成功！'); 
                                    setTimeout(() => location.href = '/__admin__/', 500); 
                                }
                                else { 
                                    ElementPlus.ElMessage.error(data.error || '登录失败'); 
                                }
                            } catch (e) { 
                                ElementPlus.ElMessage.error('网络错误，请检查连接'); 
                            }
                            finally { 
                                loading.value = false; 
                            }
                        }
                    });
                };
                
                return { loginFormRef, loading, form, rules, handleLogin };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>
</html>
