{% extends "admin/base.html" %}

{% block title %}用户管理 - Flask Admin Pro{% endblock %}

{% block breadcrumb_nav %}
<a href="{{ url_for('admin.index') }}">首页</a>
<span class="separator">/</span>
<span class="current">用户管理</span>
{% endblock %}

{% block breadcrumb %}用户管理{% endblock %}

{% block content %}
<div id="users-app">
    <div class="el-card">
        <div class="el-card__header">
            <span><i class="ph ph-users-three"></i> 用户列表</span>
            <div class="quick-actions">
                <input type="text" class="form-input" id="search-input" placeholder="搜索用户名..." style="width: 200px;" onkeyup="if(event.key==='Enter')loadUsers()">
                <button class="el-button el-button--primary" onclick="showAddModal()">
                    <i class="ph ph-user-plus"></i> 添加用户
                </button>
            </div>
        </div>
        <div class="el-card__body">
            <table class="data-table" id="users-table">
                <thead>
                    <tr>
                        <th style="width: 60px;">ID</th>
                        <th style="width: 150px;">用户名</th>
                        <th style="width: 200px;">邮箱</th>
                        <th style="width: 100px;">角色</th>
                        <th style="width: 80px;">状态</th>
                        <th style="width: 160px;">创建时间</th>
                        <th style="width: 140px;">操作</th>
                    </tr>
                </thead>
                <tbody id="users-body">
                    <tr>
                        <td colspan="7" class="empty-state">
                            <i class="ph ph-spinner ph-spin"></i>
                            <p>加载中...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <div class="pagination" id="pagination" style="margin-top: 20px; justify-content: center;"></div>
        </div>
    </div>
</div>

<!-- Add/Edit Modal -->
<div id="user-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <span id="modal-title">添加用户</span>
            <button class="modal-close-btn" onclick="closeModal()">
                <i class="ph ph-x"></i>
            </button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="user-id">
            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 6px; font-weight: 500;">用户名 *</label>
                <input type="text" id="user-username" class="form-input" placeholder="输入用户名">
            </div>
            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 6px; font-weight: 500;">邮箱</label>
                <input type="email" id="user-email" class="form-input" placeholder="输入邮箱地址">
            </div>
            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 6px; font-weight: 500;">密码 <span id="password-hint"></span></label>
                <input type="password" id="user-password" class="form-input" placeholder="输入密码">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div>
                    <label style="display: block; margin-bottom: 6px; font-weight: 500;">角色</label>
                    <select id="user-role" class="form-input form-select">
                        <option value="admin">管理员</option>
                        <option value="editor">编辑</option>
                        <option value="viewer">查看者</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 6px; font-weight: 500;">状态</label>
                    <select id="user-active" class="form-input form-select">
                        <option value="true">启用</option>
                        <option value="false">禁用</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="el-button" onclick="closeModal()">取消</button>
            <button class="el-button el-button--primary" onclick="saveUser()">保存</button>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
let users = [];
let currentPage = 1;
let editingId = null;

async function loadUsers(page = 1) {
    currentPage = page;
    const search = document.getElementById('search-input').value;
    
    try {
        const params = new URLSearchParams({ page, per_page: 20 });
        if (search) params.append('search', search);
        
        const res = await fetch(`/__admin__/api/users?${params}`);
        const data = await res.json();
        
        users = data.items || [];
        renderTable();
        renderPagination(data);
    } catch (e) {
        console.error('Failed to load users:', e);
        Toast.error('加载用户列表失败');
    }
}

function renderTable() {
    const tbody = document.getElementById('users-body');
    
    if (!users.length) {
        tbody.innerHTML = `
            <tr><td colspan="7" class="empty-state">
                <i class="ph ph-users"></i>
                <p>暂无用户数据</p>
            </td></tr>
        `;
        return;
    }
    
    tbody.innerHTML = users.map(user => `
        <tr>
            <td>${user.id}</td>
            <td><strong>${user.username}</strong></td>
            <td style="color: var(--text-secondary);">${user.email || '-'}</td>
            <td>${getRoleBadge(user.role)}</td>
            <td>${user.is_active ? '<span class="badge badge--success">启用</span>' : '<span class="badge badge--danger">禁用</span>'}</td>
            <td style="color: var(--text-secondary); font-size: 13px;">${formatTime(user.created_at)}</td>
            <td>
                <div class="table-actions">
                    <button class="el-button el-button--text el-button--small" onclick="editUser(${user.id})">
                        <i class="ph ph-pencil"></i> 编辑
                    </button>
                    <button class="el-button el-button--text el-button--small" style="color: var(--danger-color);" onclick="deleteUser(${user.id})">
                        <i class="ph ph-trash"></i> 删除
                    </button>
                </div>
            </td>
        </tr>
    `).join('');
}

function getRoleBadge(role) {
    const badges = {
        'admin': '<span class="badge badge--primary">管理员</span>',
        'editor': '<span class="badge badge--warning">编辑</span>',
        'viewer': '<span class="badge badge--info">查看者</span>',
    };
    return badges[role] || `<span class="badge">${role}</span>`;
}

function formatTime(isoStr) {
    if (!isoStr) return '-';
    return new Date(isoStr).toLocaleString('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
    });
}

function showAddModal() {
    editingId = null;
    document.getElementById('modal-title').textContent = '添加用户';
    document.getElementById('user-id').value = '';
    document.getElementById('user-username').value = '';
    document.getElementById('user-email').value = '';
    document.getElementById('user-password').value = '';
    document.getElementById('user-role').value = 'admin';
    document.getElementById('user-active').value = 'true';
    document.getElementById('password-hint').textContent = '*';
    document.getElementById('user-modal').style.display = 'flex';
}

function editUser(id) {
    const user = users.find(u => u.id === id);
    if (!user) return;
    
    editingId = id;
    document.getElementById('modal-title').textContent = '编辑用户';
    document.getElementById('user-id').value = id;
    document.getElementById('user-username').value = user.username;
    document.getElementById('user-email').value = user.email || '';
    document.getElementById('user-password').value = '';
    document.getElementById('user-role').value = user.role || 'admin';
    document.getElementById('user-active').value = user.is_active ? 'true' : 'false';
    document.getElementById('password-hint').textContent = '(留空保持不变)';
    document.getElementById('user-modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('user-modal').style.display = 'none';
    editingId = null;
}

async function saveUser() {
    const data = {
        username: document.getElementById('user-username').value.trim(),
        email: document.getElementById('user-email').value.trim(),
        role: document.getElementById('user-role').value,
        is_active: document.getElementById('user-active').value === 'true',
    };
    
    const password = document.getElementById('user-password').value;
    if (password) {
        data.password = password;
    }
    
    if (!data.username) {
        Toast.warning('请输入用户名');
        return;
    }
    
    if (!editingId && !password) {
        Toast.warning('请输入密码');
        return;
    }
    
    try {
        let url = '/__admin__/api/users';
        let method = 'POST';
        
        if (editingId) {
            url = `/__admin__/api/users/${editingId}`;
            method = 'PUT';
        }
        
        const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
        });
        
        const result = await res.json();
        
        if (result.success) {
            closeModal();
            Toast.success(editingId ? '更新成功' : '添加成功');
            loadUsers(currentPage);
        } else {
            Toast.error(result.error || '保存失败');
        }
    } catch (e) {
        Toast.error('保存失败: ' + e.message);
    }
}

async function deleteUser(id) {
    if (!confirm('确定要删除此用户吗？')) return;
    
    try {
        const res = await fetch(`/__admin__/api/users/${id}`, { method: 'DELETE' });
        const result = await res.json();
        
        if (result.success) {
            Toast.success('删除成功');
            loadUsers(currentPage);
        } else {
            Toast.error(result.error || '删除失败');
        }
    } catch (e) {
        Toast.error('删除失败: ' + e.message);
    }
}

function renderPagination(data) {
    const container = document.getElementById('pagination');
    if (!data.pages || data.pages <= 1) {
        container.innerHTML = '';
        return;
    }
    
    let html = `<span>共 ${data.total} 条</span>`;
    
    if (currentPage > 1) {
        html += `<button class="el-button el-button--small" onclick="loadUsers(${currentPage - 1})">上一页</button>`;
    }
    
    html += `<span>第 ${currentPage} / ${data.pages} 页</span>`;
    
    if (currentPage < data.pages) {
        html += `<button class="el-button el-button--small" onclick="loadUsers(${currentPage + 1})">下一页</button>`;
    }
    
    container.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', loadUsers);
</script>
{% endblock %}
