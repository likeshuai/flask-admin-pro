{% extends "admin/base.html" %}
{% block title %}用户管理 - Flask Admin Pro{% endblock %}
{% block breadcrumb %}用户管理{% endblock %}
{% block content %}
<div id="users-app">
    <el-card>
        <div style="display:flex;justify-content:space-between;margin-bottom:20px;">
            <div style="display:flex;gap:10px;"><el-input v-model="search" placeholder="搜索用户名..." style="width:200px;" clearable></el-input><el-button @click="loadUsers">搜索</el-button></div>
            <el-button type="primary" @click="showCreate">➕ 新增用户</el-button>
        </div>
        <el-table :data="users" v-loading="loading">
            <el-table-column prop="id" label="ID" width="80"></el-table-column>
            <el-table-column prop="username" label="用户名"></el-table-column>
            <el-table-column prop="email" label="邮箱"></el-table-column>
            <el-table-column prop="role" label="角色" width="100"><template #default="s"><el-tag :type="s.row.role==='admin'?'danger':'info'" size="small">{{s.row.role}}</el-tag></template></el-table-column>
            <el-table-column prop="is_active" label="状态" width="100"><template #default="s"><el-tag :type="s.row.is_active?'success':'info'" size="small">{{s.row.is_active?'启用':'禁用'}}</el-tag></template></el-table-column>
            <el-table-column label="操作" width="200"><template #default="s"><el-button size="small" @click="showEdit(s.row)">✏️ 编辑</el-button><el-button size="small" type="danger" @click="handleDelete(s.row)">🗑️ 删除</el-button></template></el-table-column>
        </el-table>
        <div style="margin-top:20px;display:flex;justify-content:flex-end;"><el-pagination v-model:current-page="page" v-model:page-size="perPage" :page-sizes="[10,20,50]" :total="total" layout="total,sizes,prev,pager,next" @size-change="loadUsers" @current-change="loadUsers"></el-pagination></div>
    </el-card>
    <el-dialog v-model="dialogVisible" :title="isEdit?'编辑用户':'新增用户'" width="500px">
        <el-form :model="form" ref="formRef" label-width="80px">
            <el-form-item label="用户名" required><el-input v-model="form.username"></el-input></el-form-item>
            <el-form-item label="邮箱"><el-input v-model="form.email"></el-input></el-form-item>
            <el-form-item label="密码" :required="!isEdit"><el-input v-model="form.password" type="password" :placeholder="isEdit?'留空不修改':''"></el-input></el-form-item>
            <el-form-item label="角色"><el-select v-model="form.role"><el-option label="管理员" value="admin"></el-option><el-option label="操作员" value="operator"></el-option></el-select></el-form-item>
            <el-form-item label="状态"><el-switch v-model="form.is_active"></el-switch></el-form-item>
        </el-form>
        <template #footer><el-button @click="dialogVisible=false">取消</el-button><el-button type="primary" @click="submit" :loading="submitting">确定</el-button></template>
    </el-dialog>
</div>
<script>
const{createApp,ref,reactive,onMounted}=Vue;
createApp({
    setup(){
        const loading=ref(false),submitting=ref(false),users=ref([]),page=ref(1),perPage=ref(20),total=ref(0),search=ref('');
        const dialogVisible=ref(false),isEdit=ref(false),editing=ref(null),formRef=ref(null);
        const form=reactive({username:'',email:'',password:'',role:'admin',is_active:true});
        const loadUsers=async()=>{loading.value=true;try{const r=await fetch(`/__admin__/api/users?page=${page.value}&per_page=${perPage.value}&search=${search.value}`);const d=await r.json();users.value=d.data||[];total.value=d.total||0;}catch(e){}finally{loading.value=false;}};
        const showCreate=()=>{isEdit.value=false;form.username='';form.email='';form.password='';form.role='admin';form.is_active=true;dialogVisible.value=true;};
        const showEdit=(u)=>{isEdit.value=true;editing.value=u;form.username=u.username;form.email=u.email||'';form.password='';form.role=u.role;form.is_active=u.is_active;dialogVisible.value=true;};
        const submit=async()=>{submitting.value=true;try{const data={...form};if(isEdit.value&&!data.password)delete data.password;const r=await fetch(isEdit.value?`/__admin__/api/users/${editing.value.id}`:'/__admin__/api/users',{method:isEdit.value?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(d.success){ElementPlus.ElMessage.success('操作成功');dialogVisible.value=false;loadUsers();}else ElementPlus.ElMessage.error(d.error);}catch(e){}finally{submitting.value=false;}};
        const handleDelete=async(u)=>{await ElementPlus.ElMessageBox.confirm(`确定删除 "${u.username}"？`);try{const r=await fetch(`/__admin__/api/users/${u.id}`,{method:'DELETE'});const d=await r.json();if(d.success){ElementPlus.ElMessage.success('删除成功');loadUsers();}}catch(e){}};
        onMounted(()=>loadUsers());
        return{loading,submitting,users,page,perPage,total,search,dialogVisible,isEdit,formRef,form,loadUsers,showCreate,showEdit,submit,handleDelete};
    }
}).use(ElementPlus).mount('#users-app');
</script>
{% endblock %}
