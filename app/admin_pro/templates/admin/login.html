<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Flask Admin Pro</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { width: 100%; max-width: 400px; padding: 20px; }
        .login-card { background: #fff; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); padding: 40px; }
        .login-title { text-align: center; margin-bottom: 30px; }
        .login-title h1 { font-size: 24px; margin-bottom: 10px; }
        .login-title p { color: #999; font-size: 14px; }
        .login-form .el-form-item { margin-bottom: 20px; }
        .login-btn { width: 100%; padding: 12px; font-size: 16px; }
        .login-footer { text-align: center; margin-top: 20px; color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="login-container">
            <div class="login-card">
                <div class="login-title"><h1>🤖 Flask Admin Pro</h1><p>管理后台登录</p></div>
                <el-form :model="form" :rules="rules" ref="loginFormRef" class="login-form">
                    <el-form-item prop="username"><el-input v-model="form.username" placeholder="用户名" size="large"></el-input></el-form-item>
                    <el-form-item prop="password"><el-input v-model="form.password" type="password" placeholder="密码" size="large" @keyup.enter="handleLogin"></el-input></el-form-item>
                    <el-form-item><el-button type="primary" class="login-btn" :loading="loading" @click="handleLogin" size="large">{% raw %}{{ loading ? '登录中...' : '登录' }}{% endraw %}</el-button></el-form-item>
                </el-form>
                <div class="login-footer"><p>默认账号：admin / admin123</p></div>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script>
        const { createApp, ref, reactive } = Vue;
        createApp({
            setup() {
                const loginFormRef = ref(null);
                const loading = ref(false);
                const form = reactive({ username: '', password: '' });
                const rules = { username: [{ required: true, message: '请输入用户名', trigger: 'blur' }], password: [{ required: true, message: '请输入密码', trigger: 'blur' }] };
                const handleLogin = async () => {
                    if (!loginFormRef.value) return;
                    await loginFormRef.value.validate(async (valid) => {
                        if (valid) {
                            loading.value = true;
                            try {
                                const res = await fetch('/__admin__/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(form) });
                                const data = await res.json();
                                if (data.success) { ElementPlus.ElMessage.success('登录成功！'); setTimeout(() => location.href = '/__admin__/', 500); }
                                else { ElementPlus.ElMessage.error(data.error || '登录失败'); }
                            } catch (e) { ElementPlus.ElMessage.error('网络错误'); }
                            finally { loading.value = false; }
                        }
                    });
                };
                return { loginFormRef, loading, form, rules, handleLogin };
            }
        }).use(ElementPlus).mount('#app');
    </script>
</body>
</html>
