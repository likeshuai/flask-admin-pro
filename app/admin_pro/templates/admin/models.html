{% extends "admin/base.html" %}

{% block title %}模型管理 - Flask Admin Pro{% endblock %}

{% block breadcrumb_nav %}
<a href="{{ url_for('admin.index') }}">首页</a>
<span class="separator">/</span>
<span class="current">模型管理</span>
{% endblock %}

{% block breadcrumb %}模型管理{% endblock %}

{% block content %}
<div id="models-app">
    <div class="el-card">
        <div class="el-card__header">
            <span><i class="ph ph-database"></i> 数据模型</span>
            <button class="el-button" onclick="loadModels()">
                <i class="ph ph-arrows-clockwise"></i> 刷新
            </button>
        </div>
        <div class="el-card__body">
            <div id="models-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;">
                <div class="empty-state">
                    <i class="ph ph-spinner ph-spin"></i>
                    <p>加载中...</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadModels() {
    const container = document.getElementById('models-grid');

    try {
        const res = await fetch('/__admin__/api/models');
        const data = await res.json();

        const models = data.models || [];

        if (!models.length) {
            container.innerHTML = `
                <div class="empty-state" style="grid-column: 1/-1;">
                    <i class="ph ph-database"></i>
                    <p>暂无可管理的模型</p>
                </div>
            `;
            return;
        }

        container.innerHTML = models.map((model, index) => `
            <div class="stat-card" style="cursor: pointer; flex-direction: column; align-items: stretch; gap: 12px;" onclick="window.location.href='/__admin__/model/${model.name}'">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="stat-icon" style="width: 40px; height: 40px; font-size: 16px; background: ${getModelColor(index)};">
                        <i class="ph ph-table"></i>
                    </div>
                    <div style="flex: 1;">
                        <div style="font-weight: 600; font-size: 15px;">${model.name}</div>
                        <div style="color: var(--text-secondary); font-size: 12px; font-family: monospace;">${model.table}</div>
                    </div>
                    <i class="ph ph-caret-right" style="color: var(--text-tertiary);"></i>
                </div>
            </div>
        `).join('');
    } catch (e) {
        console.error('Failed to load models:', e);
        container.innerHTML = `
            <div class="empty-state" style="grid-column: 1/-1;">
                <i class="ph ph-warning"></i>
                <p>加载失败</p>
            </div>
        `;
    }
}

function getModelColor(index) {
    const colors = [
        'var(--primary-color)',
        'var(--success-color)',
        'var(--warning-color)',
        '#8b5cf6',
        '#ec4899',
        '#06b6d4'
    ];
    return colors[index % colors.length];
}

document.addEventListener('DOMContentLoaded', loadModels);
</script>
{% endblock %}
