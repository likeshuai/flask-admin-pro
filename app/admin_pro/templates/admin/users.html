{% extends "admin/base.html" %}
{% block title %}用户管理 - Flask Admin Pro{% endblock %}
{% block breadcrumb %}用户管理{% endblock %}
{% block content %}
<div id="users-app">
    <el-card>
        <div style="display: flex; justify-content: space-between; margin-bottom: 24px; align-items: center;">
            <div style="display: flex; gap: 16px; flex-wrap: wrap;">
                <el-input 
                    v-model="search" 
                    placeholder="搜索用户名..." 
                    style="width: 240px;" 
                    clearable
                    prefix-icon="Search"
                ></el-input>
                <el-button @click="loadUsers" type="primary">
                    <i class="el-icon-search"></i> 搜索
                </el-button>
            </div>
            <el-button type="primary" @click="showCreate" size="large">
                <i class="el-icon-plus"></i> 新增用户
            </el-button>
        </div>
        
        <el-table :data="users" v-loading="loading" style="width: 100%;">
            <el-table-column prop="id" label="ID" width="80" sortable></el-table-column>
            <el-table-column prop="username" label="用户名" min-width="150">
                <template #default="scope">
                    <strong>{% raw %}{{ scope.row.username }}{% endraw %}</strong>
                </template>
            </el-table-column>
            <el-table-column prop="email" label="邮箱" min-width="200"></el-table-column>
            <el-table-column prop="role" label="角色" width="120">
                <template #default="scope">
                    {% raw %}<el-tag :type="scope.row.role==='admin'?'danger':'info'" size="medium">{{ scope.row.role }}</el-tag>{% endraw %}
                </template>
            </el-table-column>
            <el-table-column prop="is_active" label="状态" width="100">
                <template #default="scope">
                    {% raw %}<el-tag :type="scope.row.is_active?'success':'info'" size="medium">{{ scope.row.is_active?'启用':'禁用' }}</el-tag>{% endraw %}
                </template>
            </el-table-column>
            <el-table-column prop="created_at" label="创建时间" width="180"></el-table-column>
            <el-table-column label="操作" width="220" fixed="right">
                <template #default="scope">
                    <el-button size="small" @click="showEdit(scope.row)" type="primary">
                        <i class="el-icon-edit"></i> 编辑
                    </el-button>
                    <el-button size="small" type="danger" @click="handleDelete(scope.row)">
                        <i class="el-icon-delete"></i> 删除
                    </el-button>
                </template>
            </el-table-column>
        </el-table>
        
        <div style="margin-top: 24px; display: flex; justify-content: flex-end;">
            <el-pagination
                v-model:current-page="page"
                v-model:page-size="perPage"
                :page-sizes="[10, 20, 50, 100]"
                :total="total"
                layout="total, sizes, prev, pager, next, jumper"
                @size-change="loadUsers"
                @current-change="loadUsers"
            ></el-pagination>
        </div>
    </el-card>
    
    <el-dialog v-model="dialogVisible" :title="isEdit ? '编辑用户' : '新增用户'" width="520px">
        <el-form :model="form" ref="formRef" label-width="100px" :rules="rules">
            <el-form-item label="用户名" prop="username">
                <el-input v-model="form.username" placeholder="请输入用户名"></el-input>
            </el-form-item>
            <el-form-item label="邮箱" prop="email">
                <el-input v-model="form.email" placeholder="请输入邮箱"></el-input>
            </el-form-item>
            <el-form-item :label="isEdit ? '新密码' : '密码'" :prop="isEdit ? '' : 'password'">
                <el-input v-model="form.password" type="password" :placeholder="isEdit ? '留空不修改' : '请输入密码'"></el-input>
            </el-form-item>
            <el-form-item label="角色" prop="role">
                <el-select v-model="form.role" placeholder="请选择角色">
                    <el-option label="管理员" value="admin"></el-option>
                    <el-option label="操作员" value="operator"></el-option>
                </el-select>
            </el-form-item>
            <el-form-item label="状态" prop="is_active">
                <el-switch v-model="form.is_active" active-text="启用" inactive-text="禁用"></el-switch>
            </el-form-item>
        </el-form>
        <template #footer>
            <el-button @click="dialogVisible = false">取消</el-button>
            <el-button type="primary" @click="submit" :loading="submitting">确定</el-button>
        </template>
    </el-dialog>
</div>

<script>
const { createApp, ref, reactive, onMounted } = Vue;
createApp({
    setup() {
        const loading = ref(false);
        const submitting = ref(false);
        const users = ref([]);
        const page = ref(1);
        const perPage = ref(20);
        const total = ref(0);
        const search = ref('');
        const dialogVisible = ref(false);
        const isEdit = ref(false);
        const editingUser = ref(null);
        const formRef = ref(null);
        
        const form = reactive({
            username: '',
            email: '',
            password: '',
            role: 'admin',
            is_active: true
        });
        
        const rules = {
            username: [{ required: true, message: '请输入用户名', trigger: 'blur' }],
            email: [{ type: 'email', message: '请输入正确的邮箱格式', trigger: 'blur' }]
        };
        
        const loadUsers = async () => {
            loading.value = true;
            try {
                const response = await fetch(`/__admin__/api/users?page=${page.value}&per_page=${perPage.value}&search=${search.value}`);
                const data = await response.json();
                users.value = data.data || [];
                total.value = data.total || 0;
            } catch (error) {
                ElementPlus.ElMessage.error('加载用户列表失败');
            } finally {
                loading.value = false;
            }
        };
        
        const showCreate = () => {
            isEdit.value = false;
            editingUser.value = null;
            form.username = '';
            form.email = '';
            form.password = '';
            form.role = 'admin';
            form.is_active = true;
            dialogVisible.value = true;
        };
        
        const showEdit = (user) => {
            isEdit.value = true;
            editingUser.value = user;
            form.username = user.username;
            form.email = user.email || '';
            form.password = '';
            form.role = user.role;
            form.is_active = user.is_active;
            dialogVisible.value = true;
        };
        
        const submit = async () => {
            submitting.value = true;
            try {
                const formData = { ...form };
                if (isEdit.value && !formData.password) {
                    delete formData.password;
                }
                
                const response = await fetch(
                    isEdit.value ? `/__admin__/api/users/${editingUser.value.id}` : '/__admin__/api/users',
                    {
                        method: isEdit.value ? 'PUT' : 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    }
                );
                
                const result = await response.json();
                if (result.success) {
                    ElementPlus.ElMessage.success(isEdit.value ? '用户更新成功' : '用户创建成功');
                    dialogVisible.value = false;
                    loadUsers();
                } else {
                    ElementPlus.ElMessage.error(result.error || '操作失败');
                }
            } catch (error) {
                ElementPlus.ElMessage.error('网络错误');
            } finally {
                submitting.value = false;
            }
        };
        
        const handleDelete = async (user) => {
            try {
                await ElementPlus.ElMessageBox.confirm(
                    `确定要删除用户 "${user.username}" 吗？此操作不可恢复。`,
                    '确认删除',
                    {
                        confirmButtonText: '确定',
                        cancelButtonText: '取消',
                        type: 'warning'
                    }
                );
                
                const response = await fetch(`/__admin__/api/users/${user.id}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                if (result.success) {
                    ElementPlus.ElMessage.success('用户删除成功');
                    loadUsers();
                } else {
                    ElementPlus.ElMessage.error(result.error || '删除失败');
                }
            } catch (error) {
                // User cancelled
            }
        };
        
        onMounted(() => {
            loadUsers();
        });
        
        return {
            loading,
            submitting,
            users,
            page,
            perPage,
            total,
            search,
            dialogVisible,
            isEdit,
            formRef,
            form,
            rules,
            loadUsers,
            showCreate,
            showEdit,
            submit,
            handleDelete
        };
    }
}).use(ElementPlus).mount('#users-app');
</script>
{% endblock %}
