{% extends "admin/base.html" %}
{% block title %}模型管理 - Flask Admin Pro{% endblock %}
{% block breadcrumb %}模型管理{% endblock %}
{% block content %}
<div id="models-app">
    <el-card>
        <template #header><span>📁 数据模型列表</span></template>
        <el-table :data="models" v-loading="loading">
            <el-table-column prop="name" label="模型名称"><template #default="s">{% raw %}<strong>{{s.row.name}}</strong>{% endraw %}</template></el-table-column>
            <el-table-column prop="table" label="数据表"></el-table-column>
            <el-table-column label="操作" width="200"><template #default="s"><el-button type="primary" size="small" @click="goTo(s.row.name)">📊 管理数据</el-button></template></el-table-column>
        </el-table>
        <el-empty v-if="models.length===0&&!loading" description="暂无数据模型"></el-empty>
    </el-card>
    <el-card style="margin-top:20px;"><template #header><span>💡 使用说明</span></template><div style="color:#666;line-height:1.8;"><p>1. 点击「管理数据」可查看和管理模型数据</p><p>2. 系统自动扫描 SQLAlchemy 模型</p><p>3. 支持搜索、分页、排序等 CRUD 操作</p></div></el-card>
</div>
<script>
const{createApp,ref,onMounted}=Vue;
createApp({
    setup(){
        const loading=ref(false),models=ref([]);
        const loadModels=async()=>{loading.value=true;try{const r=await fetch('/__admin__/api/models');const d=await r.json();models.value=d.models||[];}catch(e){}finally{loading.value=false;}};
        const goTo=(n)=>location.href=`/__admin__/model/${n}`;
        onMounted(()=>loadModels());
        return{loading,models,goTo};
    }
}).use(ElementPlus).mount('#models-app');
</script>
{% endblock %}
